name: Deploy via Self-Hosted Runner

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
    - name: Pull latest code and deploy
      run: |
        cd /home/ubuntu/devops-multi-app-deployment || git clone https://github.com/prabool3822/devops-multi-app-deployment.git
        cd devops-multi-app-deployment
        git pull origin main
        docker compose down
        docker compose up -d --build

